<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharma OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="page-header">
    <h1>Pharma OS</h1>
    <p>The enterprise decision operating system for life sciences — six layers, bottom to top. Click any layer to open it.</p>
  </header>

  <main>
    <section class="outcomes-band" id="outcomes-band" aria-label="Business outcomes"></section>

    <div class="diagram">
      <aside class="governance-rail" id="governance-rail" aria-label="Governance, applies to all six layers"></aside>
      <div class="stack" id="stack" aria-label="The six layers of Pharma OS"></div>
    </div>

    <section class="platform-band" id="platform-band" aria-label="Platform-agnostic foundation">
      <div class="platform-band-head">
        <h2>Platform-agnostic foundation</h2>
      </div>
      <div class="platform-grid" id="platform-grid"></div>
    </section>
  </main>

  <footer class="page-footer">
    Synthetic demonstration data.
  </footer>

  <script src="content.js"></script>
  <script>
    document.getElementById("outcomes-band").innerHTML = renderOutcomesBand();
    document.getElementById("governance-rail").innerHTML = renderGovernanceRail();
    document.getElementById("platform-grid").innerHTML = renderPlatformBand();

    const stack = document.getElementById("stack");
    stack.innerHTML = PHARMA_OS_LAYERS.map(renderLayerBlock).join("");

    stack.addEventListener("click", (event) => {
      const tab = event.target.closest(".domain-tab");
      if (tab) {
        const layerEl = tab.closest(".layer");
        const domain = tab.dataset.domain;

        layerEl.querySelectorAll(".domain-tab").forEach((t) => {
          const active = t === tab;
          t.classList.toggle("is-active", active);
          t.setAttribute("aria-pressed", String(active));
        });
        layerEl.querySelectorAll("[data-leader-panel]").forEach((p) => {
          p.classList.toggle("is-active", p.dataset.leaderPanel === domain);
        });
        layerEl.querySelectorAll("[data-source-group]").forEach((g) => {
          g.classList.toggle("is-active", g.dataset.sourceGroup === domain);
        });
        return;
      }

      const header = event.target.closest(".layer-header");
      if (!header) return;

      const layerEl = header.closest(".layer");
      const isExpanded = layerEl.getAttribute("data-expanded") === "true";

      // Accordion: only one layer open at a time, so the stack stays one object.
      stack.querySelectorAll(".layer").forEach((el) => {
        el.removeAttribute("data-expanded");
        el.querySelector(".layer-header").setAttribute("aria-expanded", "false");
      });

      if (!isExpanded) {
        layerEl.setAttribute("data-expanded", "true");
        header.setAttribute("aria-expanded", "true");
      }
    });
  </script>
</body>
</html>
